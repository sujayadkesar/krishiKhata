name: Build APK

# Builds and signs the Android app in the cloud, so no Android SDK or JDK is
# needed locally. GitHub's ubuntu-latest runner ships both.
#
# Free: Actions costs nothing on public repositories. On private ones a build
# uses a few minutes of the monthly free allowance.
#
# Run it from the Actions tab, or push a v* tag to also publish a Release.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Which build to produce
        type: choice
        options: [auto, debug, release]
        default: auto
  push:
    tags: ['v*']

permissions:
  contents: write # needed only to attach the APK to a tagged Release

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # The `secrets` context cannot be read from a step-level `if:` — doing so
      # fails the run with "Unrecognized named-value: 'secrets'". Lifting it
      # into an env var at job level is the pattern that works.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: app
        run: npm ci

      # The gate. A build that fails these must never reach a phone: the FIFO
      # allocation engine decides what a farmer owes someone standing in front
      # of them.
      - name: Run checks
        working-directory: app
        run: npm run check

      - name: Lint
        working-directory: app
        run: npm run lint

      # VITE_GOOGLE_CLIENT_ID turns on Drive backup. Absent, the build still
      # succeeds and the app simply reports that backup is not set up yet —
      # which is why this is a plain secret reference with no gate around it.
      # It is not a credential: an Android OAuth client has no client secret,
      # and this id ends up readable inside the APK either way.
      - name: Build web assets
        working-directory: app
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Sync Capacitor
        working-directory: app
        run: npx cap sync android

      # Git on Windows does not record the executable bit, so gradlew can be
      # committed as mode 100644 and the Linux runner then refuses to run it
      # ("Permission denied", exit 126). The bit is set correctly in the repo
      # now; this keeps the build working even if a future Windows commit
      # drops it again.
      - name: Make gradlew executable
        run: chmod +x app/android/gradlew

      - name: Decide build type
        id: decide
        run: |
          REQUESTED="${{ inputs.build_type || 'auto' }}"
          if [ "$REQUESTED" = "release" ] || { [ "$REQUESTED" = "auto" ] && [ "$HAS_KEYSTORE" = "true" ]; }; then
            if [ "$HAS_KEYSTORE" != "true" ]; then
              echo "::error::A release build was requested but ANDROID_KEYSTORE_BASE64 is not set. Run the 'Create signing key' workflow first."
              exit 1
            fi
            echo "type=release" >> "$GITHUB_OUTPUT"
          else
            echo "type=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore keystore
        if: steps.decide.outputs.type == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/android/release.keystore
          cat > app/android/keystore.properties <<EOF
          storeFile=../release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Invoked as `sh gradlew`, not `./gradlew`. The wrapper is a POSIX shell
      # script, so running it through sh ignores the executable bit entirely —
      # which is the one thing Git on Windows cannot be relied on to preserve.
      - name: Build release APK
        if: steps.decide.outputs.type == 'release'
        working-directory: app/android
        run: sh gradlew assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        if: steps.decide.outputs.type == 'debug'
        working-directory: app/android
        run: sh gradlew assembleDebug --no-daemon --stacktrace

      # The signing material must not outlive the job, even on a private runner.
      - name: Shred signing material
        if: always()
        run: rm -f app/android/release.keystore app/android/keystore.properties

      - name: Collect APK
        id: collect
        run: |
          mkdir -p out
          find app/android -path "*/outputs/apk/*" -name "*.apk" -exec cp {} out/ \;
          ls -la out
          echo "name=$(ls out | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: krishi-khata-apk-${{ steps.decide.outputs.type }}
          path: out/*.apk
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### Krishi Khata APK"
            echo ""
            echo "**Build type:** ${{ steps.decide.outputs.type }}"
            echo "**File:** ${{ steps.collect.outputs.name }}"
            echo ""
            if [ "${{ steps.decide.outputs.type }}" = "debug" ]; then
              echo "> This is a **debug** build. Fine for testing, but do not share it:"
              echo "> a release-signed APK cannot be installed over a debug-signed one,"
              echo "> so users would have to uninstall — and uninstalling takes their"
              echo "> records with it. Run **Create signing key** first, then rebuild."
            fi
            echo ""
            echo "Download it from the **Artifacts** section of this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
