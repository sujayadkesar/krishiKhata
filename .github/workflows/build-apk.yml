name: Build APK

# Builds and signs the Android app in the cloud, so no Android SDK or Java
# install is needed locally. Free: GitHub Actions costs nothing for public
# repositories, and for private ones this uses a few minutes of the monthly
# free allowance per build.
#
# Trigger it by hand from the Actions tab, or by pushing a v* tag.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: app
        run: npm ci

      # The gate. A build that fails these must never reach a phone, because
      # the FIFO allocation engine decides what a farmer owes someone standing
      # in front of them.
      - name: Run checks
        working-directory: app
        run: npm run check

      - name: Build web assets
        working-directory: app
        run: npm run build

      - name: Sync Capacitor
        working-directory: app
        run: npx cap sync android

      - name: Decode keystore
        # Optional. Without the secrets this still produces a debug-signed APK,
        # which installs fine for testing but cannot be upgraded over a
        # release-signed one later, so set the secrets before sharing widely.
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/android/release.keystore
          cat >> app/android/keystore.properties <<EOF
          storeFile=../release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          find app/android -name "*.apk" -path "*/outputs/*" -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: krishi-khata-apk
          path: out/*.apk
          retention-days: 30

      # A tagged build also becomes a release, which is the link to send a
      # farmer. GitHub serves release assets from private repositories only to
      # people who can see the repository, so make it public or share the APK
      # directly.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
