name: Create signing key

# RUN THIS ONCE, EVER.
#
# The keystore is the app's permanent identity. Android will only install an
# update over an app signed with the same key, so generating a second one means
# every farmer who already has Krishi Khata must uninstall to move forward —
# and uninstalling takes their records with it. The guard below refuses to run
# a second time unless you deliberately override it.
#
# Generating locally is strictly safer, because the key never leaves your
# machine:
#
#   keytool -genkey -v -keystore krishikhata.keystore -alias krishikhata \
#           -keyalg RSA -keysize 2048 -validity 10000
#
# This workflow exists for convenience. It generates the key on a runner and
# hands it back; the trade is that the key briefly exists in GitHub's storage.

on:
  workflow_dispatch:
    inputs:
      validity_years:
        description: How long the key stays valid
        type: string
        default: '30'
      overwrite:
        description: I understand this replaces an existing key and breaks updates for anyone who has already installed the app
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest

    env:
      # secrets cannot be read from a step-level `if:`, so it is lifted here.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PAT: ${{ secrets.GH_PAT != '' }}

    steps:
      - name: Refuse to overwrite an existing key
        run: |
          if [ "$HAS_KEYSTORE" = "true" ] && [ "${{ inputs.overwrite }}" != "true" ]; then
            echo "::error::A signing key already exists for this repository. Creating another one means nobody who has installed the app can update it — they would have to uninstall and lose their records. If you are certain, re-run with 'overwrite' ticked."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate keystore
        id: gen
        run: |
          # Passwords are generated here and masked immediately, so they never
          # appear in the log even if a later command echoes them.
          STORE_PASSWORD="$(openssl rand -base64 33 | tr -d '\n/+=' | head -c 32)"
          KEY_PASSWORD="$STORE_PASSWORD"
          echo "::add-mask::$STORE_PASSWORD"

          ALIAS="krishikhata"
          DAYS=$(( ${{ inputs.validity_years }} * 365 ))

          keytool -genkeypair -v \
            -keystore krishikhata.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity "$DAYS" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Krishi Khata, OU=Krishi Khata, O=Krishi Khata, L=Yellapur, ST=Karnataka, C=IN"

          base64 -w0 krishikhata.keystore > krishikhata.keystore.base64

          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

          # The SHA-1 is what Google Cloud needs for Drive backup. It is a
          # public fingerprint, not a secret, so printing it is fine and saves
          # a lot of hunting later.
          keytool -list -v -keystore krishikhata.keystore -storepass "$STORE_PASSWORD" \
            | grep -E "SHA1:|SHA256:" > fingerprints.txt
          cat fingerprints.txt

      # Fully automatic, if you have added a GH_PAT secret with repo scope.
      - name: Store secrets automatically
        if: env.HAS_PAT == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set ANDROID_KEYSTORE_BASE64 --repo "${{ github.repository }}" < krishikhata.keystore.base64
          gh secret set ANDROID_KEYSTORE_PASSWORD --repo "${{ github.repository }}" --body "$STORE_PASSWORD"
          gh secret set ANDROID_KEY_PASSWORD --repo "${{ github.repository }}" --body "$STORE_PASSWORD"
          gh secret set ANDROID_KEY_ALIAS --repo "${{ github.repository }}" --body "$KEY_ALIAS"
          echo "AUTO_DONE=true" >> "$GITHUB_ENV"

      - name: Write instructions
        run: |
          cat > SECRETS.md <<'HEADER'
          # Krishi Khata signing key

          Keep `krishikhata.keystore` somewhere safe and backed up. If it is lost,
          nobody who has installed the app can ever receive an update again.

          Never commit it. Never put it in a public place.
          HEADER

          {
            echo ""
            echo "## Repository secrets"
            echo ""
            echo "Settings -> Secrets and variables -> Actions -> New repository secret"
            echo ""
            echo '| Name | Value |'
            echo '|---|---|'
            echo "| ANDROID_KEYSTORE_BASE64 | contents of krishikhata.keystore.base64 |"
            echo "| ANDROID_KEYSTORE_PASSWORD | $STORE_PASSWORD |"
            echo "| ANDROID_KEY_PASSWORD | $STORE_PASSWORD |"
            echo "| ANDROID_KEY_ALIAS | $KEY_ALIAS |"
            echo ""
            echo "## Fingerprints"
            echo ""
            echo "The SHA-1 below is what Google Cloud Console needs when creating the"
            echo "Android OAuth client for Drive backup (docs/BACKUP-SETUP.md)."
            echo ""
            cat fingerprints.txt
          } >> SECRETS.md

      - uses: actions/upload-artifact@v4
        with:
          name: krishi-khata-signing-key
          path: |
            krishikhata.keystore
            krishikhata.keystore.base64
            SECRETS.md
          retention-days: 1

      - name: Summary
        run: |
          {
            echo "### Signing key created"
            echo ""
            if [ "${AUTO_DONE:-}" = "true" ]; then
              echo "The four repository secrets have been set automatically."
              echo "**Build APK** will now produce a signed release build."
            else
              echo "Download the **krishi-khata-signing-key** artifact from this run."
              echo "It contains the keystore and a \`SECRETS.md\` listing the four"
              echo "values to add under *Settings -> Secrets and variables -> Actions*."
              echo ""
              echo "To have this done for you next time, add a \`GH_PAT\` secret"
              echo "holding a personal access token with **repo** scope."
            fi
            echo ""
            echo "> **Download the artifact and store the keystore somewhere safe.**"
            echo "> It is deleted from GitHub after one day, and it cannot be"
            echo "> regenerated — a different key locks every existing install out"
            echo "> of updates."
            echo ""
            echo "The SHA-1 fingerprint in \`SECRETS.md\` is what Google Cloud needs"
            echo "for Drive backup."
          } >> "$GITHUB_STEP_SUMMARY"
